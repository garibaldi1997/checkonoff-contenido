name: Anuncios (Meta Ads)

# Solo se ejecuta a mano. Las campañas se crean en pausa: el dueño las activa.
on:
  workflow_dispatch:
    inputs:
      accion:
        description: "verificar"
        default: verificar

permissions:
  contents: write

concurrency:
  group: anuncios
  cancel-in-progress: false

jobs:
  anuncios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Anuncios
        env:
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
          META_AD_ACCOUNT: act_1648565720071394
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v26.0' }}
        run: python scripts/anuncios.py ${{ inputs.accion }}
      - name: Guardar estado
        if: always()
        run: |
          git config user.name "checkonoff-bot"
          git config user.email "checkonoff-bot@users.noreply.github.com"
          git add estado/anuncios.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Estado de anuncios [skip ci]" && git pull --rebase -q origin main && git push origin main)
