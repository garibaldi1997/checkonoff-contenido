name: Publicar en redes

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # cada 15 min, fuera de los minutos de mayor carga
  workflow_dispatch:
    inputs:
      modo:
        description: "publicar | verificar | simular"
        default: publicar

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      # Siempre la versión más reciente de main (no la del momento en que se disparó),
      # para ver lo que otra corrida ya publicó y no repetir publicaciones.
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Versión actual
        run: echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publicar
        env:
          # Un token por cuenta (ver cuentas.json). Al agregar una cuenta, añade su línea aquí.
          META_TOKEN_CHECKONOFF: ${{ secrets.META_TOKEN_CHECKONOFF }}
          META_TOKEN_DIELOXIA: ${{ secrets.META_TOKEN_DIELOXIA }}
          LINKEDIN_TOKEN_GARIBALDI: ${{ secrets.LINKEDIN_TOKEN_GARIBALDI }}
          LINKEDIN_TOKEN_CHECKONOFF: ${{ secrets.LINKEDIN_TOKEN_CHECKONOFF }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v26.0' }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ env.SHA }}
          VIDEO_BASE: https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ env.SHA }}
          DRY_RUN: ${{ inputs.modo == 'simular' && '1' || '0' }}
        run: |
          if [ "${{ inputs.modo }}" = "verificar" ]; then
            python scripts/publicar.py --verificar
            python scripts/diag_linkedin.py || true
          else
            s=0; python scripts/publicar.py || s=$?
            python scripts/linkedin_dieloxia.py || true   # carrusel diario de Dieloxia en LinkedIn
            exit $s
          fi

      - name: Guardar registro de publicaciones
        if: always()
        run: |
          if [ -n "$(git status --porcelain estado/)" ]; then
            git config user.name "checkonoff-bot"
            git config user.email "checkonoff-bot@users.noreply.github.com"
            python scripts/panel.py
            git add estado/ docs/
            git commit -m "Registro de publicaciones [skip ci]"
            if ! git pull --rebase -q; then
              # Otra corrida guardó al mismo tiempo: se combinan ambos registros en vez de fallar.
              git rebase --abort
              cp estado/publicados.json /tmp/mio.json
              git reset -q --hard origin/main 2>/dev/null || true
              git fetch -q origin main && git reset -q --hard origin/main
              python3 - <<'PY'
          import json
          mio = json.load(open('/tmp/mio.json')); suyo = json.load(open('estado/publicados.json'))
          for k, redes in mio.items():
              for red, v in redes.items():
                  suyo.setdefault(k, {}).setdefault(red, v)
          json.dump(suyo, open('estado/publicados.json', 'w'), ensure_ascii=False, indent=2)
          PY
              python scripts/panel.py
              git add estado/ docs/
              git commit -m "Registro de publicaciones (combinado) [skip ci]"
            fi
            git push
          fi
# activado
