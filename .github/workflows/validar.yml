name: Validar calendario

on:
  push:
    paths: ["calendario.json", "cuentas.json", "contenido/**", "scripts/**"]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/publicar.py --validar
